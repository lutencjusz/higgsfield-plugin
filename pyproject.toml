[project]
name = "higgsfield-plugin"
version = "0.3.0"
description = "CLI do generowania i edycji obrazów oraz wideo przez Higgsfield API + skille Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "lutencjusz" }]
# SDK 0.2.x: korzystamy z jego klienta HTTP (_transport/_client) — przy zmianie
# minor-wersji sprawdź higgsfield_cli/client.py (podklasa SyncClient).
dependencies = ["higgsfield-client>=0.2,<0.3", "httpx>=0.27"]

[project.scripts]
higgsfield = "higgsfield_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/higgsfield_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
